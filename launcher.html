<!doctype html>
<html style="background:#000"><head><meta charset="utf-8"><title>Minecraft</title>__ICON____CSS__<script>
// Minecraft-Auto.html: the build that was current when this file was made is carried below as inert text. On every open, if
// a newer build has been downloaded since (see updater.js), that one is written into the page instead; otherwise the one
// carried here is.
(function () {
  var FLAG = "arc:update", DB = "arc-update", BUILD = "__BUILD__";
  var cmp = function (a, b) {
    a = String(a).split("."); b = String(b).split(".");
    for (var i = 0; i < 3; i++) { var d = (+a[i] || 0) - (+b[i] || 0); if (d) return d; }
    return 0;
  };
  var L = window.__arcLauncher = { swapping: false, fallback: null, failed: false, shown: false };
  // The page is written in slices so no single document.write call has to carry 70+ MB.
  L.write = function (html) {
    document.open();
    for (var i = 0; i < html.length; i += 4194304) document.write(html.slice(i, i + 4194304));
    document.close();
  };
  var ready = null;
  try { ready = localStorage.getItem(FLAG); } catch (e) {}
  if (!(ready && cmp(ready, BUILD) > 0) || !window.indexedDB) return;
  L.swapping = true;
  var open = indexedDB.open(DB, 1);
  var fail = function () {
    try { localStorage.removeItem(FLAG); } catch (e) {}
    L.swapping = false; L.failed = true;
    if (L.fallback) L.fallback();                       // the stored copy is gone: use the one carried here
  };
  open.onupgradeneeded = function () { open.result.createObjectStore("b"); };
  open.onerror = fail;
  open.onsuccess = function () {
    var req = open.result.transaction("b", "readonly").objectStore("b").get("build");
    req.onerror = fail;
    req.onsuccess = function () {
      var rec = req.result;
      open.result.close();
      if (!rec || rec.version !== ready) return fail();
      rec.blob.text().then(L.write, fail);
    };
  };
})();
</script></head><body style="position:fixed;inset:0;margin:0;width:100%;height:100%;overflow:hidden;background:#000">__COVER__<script>
// The cover, tab title and icon are shown from the first bytes; the build below only starts once it has all arrived.
function ldWire(root) {
  const foot = root.querySelector(".ld-foot-r"), link = root.querySelector(".ld-status");
  if (!foot || !link) return;
  function setOpen(on) { foot.classList.toggle("ld-open", on); link.setAttribute("aria-expanded", on ? "true" : "false"); }
  // Toggles on pointerdown so the popup answers the press itself, not the release; the click that follows only has its default (following the link) cancelled.
  link.addEventListener("pointerdown", function (e) { if (e.button) return; e.preventDefault(); e.stopPropagation(); setOpen(!foot.classList.contains("ld-open")); });
  link.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); });
  root.addEventListener("click", function (e) { if (!foot.contains(e.target)) setOpen(false); });
  document.addEventListener("keydown", function esc(e) { if (!root.isConnected) return document.removeEventListener("keydown", esc); if (e.key === "Escape") setOpen(false); });
}
ldWire(document.getElementById("brand-load"));
setTimeout(function () { var c = document.getElementById("brand-load"); if (c) { c.classList.add("ld-in"); window.__arcLauncher.shown = true; } }, 500);
</script><script type="text/plain" id="arc-embedded">__EMBEDDED__</script><script>
(function () {
  var L = window.__arcLauncher;
  var start = function () { L.write(document.getElementById("arc-embedded").textContent.replace(/\u0001/g, "<")); };
  if (L.failed || !L.swapping) start(); else L.fallback = start;
})();
</script></body></html>
